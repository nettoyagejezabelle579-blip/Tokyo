<!doctype html><html><head><meta charset="utf-8"><title>Photo pose</title><style>html,body{margin:0;height:100%;background:#222;overflow:hidden}#ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}</style></head><body>
<!-- Align a street photo with the PLATEAU city: ?px&py&pz (camera), yaw, pitch, roll (deg), f (focal px), cx, cy (principal point), w,h (photo size), photo=url, alpha=overlay opacity.
     window.pick(u, v) -> world point under photo pixel (u, v). Used to solve photo cameras for projection texturing. -->
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/addons/", "three-mesh-bvh": "../vendor/three-mesh-bvh.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { City } from '../src/city.js';
const q = new URLSearchParams(location.search), n = (k, d) => +(q.get(k) ?? d);
const W = n('w', 1920), H = n('h', 1280);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H, false); r.domElement.style.cssText = 'width:100%;height:100%;object-fit:contain';
r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbcd0e0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2.6));
// pinhole with focal length f (px) and principal point (cx, cy): perspective-corrected photos keep verticals
// vertical by shifting the principal point instead of tilting the camera
const f = n('f', 1000), cx = n('cx', W / 2), cy = n('cy', H / 2);
const fullW = 2 * Math.max(cx, W - cx), fullH = 2 * Math.max(cy, H - cy);
const cam = new THREE.PerspectiveCamera(2 * Math.atan(fullH / 2 / f) * 180 / Math.PI, fullW / fullH, 0.5, 5000);
cam.setViewOffset(fullW, fullH, fullW / 2 - cx, fullH / 2 - cy, W, H);
const yaw = n('yaw', 0) * Math.PI / 180, pitch = n('pitch', 0) * Math.PI / 180, roll = n('roll', 0) * Math.PI / 180;
cam.position.set(n('px', 0), n('py', 1.6), n('pz', 0));
cam.rotation.order = 'YXZ'; cam.rotation.set(pitch, yaw, roll);
if (q.get('photo')) { const im = document.createElement('img'); im.id = 'ov'; im.src = q.get('photo'); im.style.opacity = n('alpha', 0.5); im.style.objectFit = 'contain'; document.body.appendChild(im); }
const city = new City(scene);
await city.loadGround();
await city.load([cam.position.x, 0, cam.position.z]);
await new Promise((res) => setTimeout(res, 4000));
r.render(scene, cam);
const ray = new THREE.Raycaster();
window.pick = (u, v) => {
  ray.setFromCamera(new THREE.Vector2(u / W * 2 - 1, -(v / H) * 2 + 1), cam);
  const h = ray.intersectObjects([...city.solid, ...city.root.children.filter((o) => o.isMesh)], true)[0];
  return h ? [+h.point.x.toFixed(2), +h.point.y.toFixed(2), +h.point.z.toFixed(2)] : null;
};
window.project = (x, y, z) => { const p = new THREE.Vector3(x, y, z).project(cam); return [+((p.x + 1) / 2 * W).toFixed(1), +((1 - p.y) / 2 * H).toFixed(1), p.z < 1]; };
window.__done = true;
setInterval(() => r.render(scene, cam), 1000);
</script></body></html>
