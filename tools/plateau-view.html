<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#222}</style></head><body>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/addons/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9ec4e8);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2)); const d = new THREE.DirectionalLight(0xffffff, 1.5); d.position.set(100, 300, 50); scene.add(d);
const S = +(q.get('s') || 300), cx = +(q.get('x') || 0), cz = +(q.get('z') || 0);
let cam;
if (q.get('view') === 'top') { const a = innerWidth / innerHeight; cam = new THREE.OrthographicCamera(-S * a, S * a, S, -S, 1, 2000); cam.position.set(cx, 800, cz); cam.lookAt(cx, 0, cz); cam.up.set(0, 0, -1); cam.lookAt(cx, 0, cz); }
else { cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.3, 5000); cam.position.set(+q.get('px'), +q.get('py'), +q.get('pz')); cam.lookAt(+q.get('lx'), +q.get('ly'), +q.get('lz')); }
const draco = new DRACOLoader().setDecoderPath('../vendor/addons/libs/draco/gltf/');
const L = new GLTFLoader().setDRACOLoader(draco);
const idx = await (await fetch('../assets/plateau/index.json')).json();
const sets = (q.get('sets') || 'tran,brid,frn,veg,plant,bldg').split(',');
let n = 0, total = 0;
for (const s of sets) for (const e of idx.sets[s]) { total++; L.load('../assets/plateau/' + e.f, (g) => { g.scene.traverse((o) => { if (o.isMesh && s === 'tran') o.material = new THREE.MeshLambertMaterial({ color: 0x555555 }); }); scene.add(g.scene); n++; }, undefined, () => n++); }
// grid + axes labels for calibration
if (q.get('grid')) { const gs = +(q.get("gs") || 50); const g = new THREE.GridHelper(1400, 1400 / gs, 0xff0000, 0xffff00); g.position.y = 40; scene.add(g); }
const mark = (x, z, c) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 200), new THREE.MeshBasicMaterial({ color: c })); m.position.set(x, 100, z); scene.add(m); };
mark(0, 0, 0xff00ff);
function loop() { r.render(scene, cam); requestAnimationFrame(loop); }
loop();
window.__done = () => n >= total;
</script></body></html>
